<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing · Aurelia Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
let me;
(async () => { me = await guard('billing', { roles:['admin','receptionist'] }); if (me) view(); })();
async function view(){
  const [iv, p] = await Promise.all([
    sb.from('invoices').select('*, patients(full_name)').order('created_at', { ascending:false }),
    sb.from('patients').select('id, full_name').order('full_name')
  ]);
  if (iv.error) return err(iv.error);
  const sum = s => iv.data.filter(x => x.status === s).reduce((t, x) => t + Number(x.amount), 0);
  $('view').innerHTML = `<div class="bar"><h2>Billing</h2><button id="add">New invoice</button></div>
    <div class="stats"><div class="stat"><b>${money(sum('unpaid'))}</b><span>Unpaid</span></div><div class="stat"><b>${money(sum('paid'))}</b><span>Collected</span></div></div>
    <form id="f" class="form hide">
      <div><label>Patient</label><select name="patient_id" required><option value="">Choose patient</option>${(p.data || []).map(x => `<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></div>
      <div><label>Amount (GH₵)</label><input name="amount" type="number" min="0" step="0.01" required></div>
      <div class="full"><label>Description</label><input name="description" required placeholder="Consultation, lab fees, medication"></div>
      <div class="full"><button>Create invoice</button></div></form>
    ${iv.data.length ? `<div class="wrap"><table><tr><th>Date</th><th>Patient</th><th>Description</th><th>Amount</th><th>Status</th><th></th></tr>
    ${iv.data.map(x => `<tr><td>${esc(new Date(x.created_at).toLocaleDateString())}</td><td><a href="patient.html?id=${x.patient_id}">${esc(x.patients?.full_name)}</a></td><td>${esc(x.description)}</td><td>${money(x.amount)}</td>
    <td><span class="pill">${esc(x.status)}${x.payment_method ? ' · ' + esc(x.payment_method) : ''}</span></td>
    <td>${x.status === 'unpaid' ? `<select data-m="${x.id}"><option>Cash</option><option>Mobile money</option><option>Card</option><option>Insurance</option></select> <button data-pay="${x.id}">Mark paid</button> ${me.role === 'admin' ? `<button class="danger" data-void="${x.id}">Void</button>` : ''}` : ''}</td></tr>`).join('')}</table></div>` : '<div class="empty">No invoices yet.</div>'}`;
  $('add').onclick = () => $('f').classList.toggle('hide');
  $('f').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.amount = Number(f.amount); f.created_by = me.id;
    const { error } = await sb.from('invoices').insert(f); if (error) return err(error); view(); };
  document.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => {
    const m = document.querySelector(`[data-m="${b.dataset.pay}"]`).value;
    const { error } = await sb.from('invoices').update({ status:'paid', payment_method:m, paid_at:new Date().toISOString() }).eq('id', b.dataset.pay); if (error) return err(error); view(); });
  document.querySelectorAll('[data-void]').forEach(b => b.onclick = async () => { if (!confirm('Void this invoice?')) return;
    const { error } = await sb.from('invoices').update({ status:'void' }).eq('id', b.dataset.void); if (error) return err(error); view(); });
}
</script>
</body>
</html>
