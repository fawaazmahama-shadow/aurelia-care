<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Aurelia Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="center"><div class="box">
  <h1>Aurelia Care</h1><p>Enter your email and we will send a reset link.</p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email"><button class="full" id="go">Send reset link</button>
  <a href="login.html" style="display:block;margin-top:12px;font-size:.9rem">Back to sign in</a>
  <div class="msg" id="msg" role="alert"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
if (!configured) needSetup(); else {
$('go').onclick = async () => {
  const email = $('em').value.trim(), msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
  if (!email){ msg.textContent = 'Enter your email.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL('reset.html', location.href).href });
  if (error) msg.textContent = error.message; else { msg.className = 'msg ok'; msg.textContent = 'If that email has an account, a reset link is on its way.'; }
};
}
</script>
</body>
</html>
