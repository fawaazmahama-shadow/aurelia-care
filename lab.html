<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab tests · Aurelia Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
let me;
(async () => { me = await guard('lab', { roles:['admin','doctor','nurse'] }); if (me) view(); })();
async function view(){
  const [t, p] = await Promise.all([
    sb.from('lab_tests').select('*, patients(full_name)').order('created_at', { ascending:false }),
    sb.from('patients').select('id, full_name').order('full_name')
  ]);
  if (t.error) return err(t.error);
  const canOrder = ['admin','doctor'].includes(me.role);
  $('view').innerHTML = `<div class="bar"><h2>Lab tests</h2>${canOrder ? '<button id="add">Order a test</button>' : ''}</div>
    ${canOrder ? `<form id="f" class="form hide"><div><label>Patient</label><select name="patient_id" required><option value="">Choose patient</option>${(p.data || []).map(x => `<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></div>
      <div><label>Test</label><input name="test_name" required placeholder="Malaria test, full blood count"></div><div class="full"><button>Order test</button></div></form>` : ''}
    ${t.data.length ? `<div class="wrap"><table><tr><th>Ordered</th><th>Patient</th><th>Test</th><th>Status</th><th>Result</th></tr>
    ${t.data.map(x => `<tr><td>${esc(new Date(x.created_at).toLocaleDateString())}</td><td><a href="patient.html?id=${x.patient_id}">${esc(x.patients?.full_name)}</a></td><td>${esc(x.test_name)}</td><td><span class="pill">${esc(x.status)}</span></td>
    <td>${x.status === 'completed' ? esc(x.result) : `<textarea rows="2" data-r="${x.id}" placeholder="Enter result"></textarea><button data-save="${x.id}" style="margin-top:6px">Save result</button>`}</td></tr>`).join('')}</table></div>` : '<div class="empty">No lab tests yet.</div>'}`;
  if (canOrder){ $('add').onclick = () => $('f').classList.toggle('hide');
    $('f').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.ordered_by = me.id;
      const { error } = await sb.from('lab_tests').insert(f); if (error) return err(error); view(); }; }
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const r = document.querySelector(`[data-r="${b.dataset.save}"]`).value.trim(); if (!r) return alert('Enter a result first.');
    const { error } = await sb.from('lab_tests').update({ status:'completed', result:r, completed_at:new Date().toISOString() }).eq('id', b.dataset.save); if (error) return err(error); view(); });
}
</script>
</body>
</html>
