<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patients · Aurelia Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
let me;
(async () => { me = await guard('patients'); if (me) patientsView(); })();

async function patientsView(q = ''){
  let query = sb.from('patients').select('*').order('created_at', { ascending:false });
  if (q) query = query.ilike('full_name', '%' + q.replace(/[%,]/g,'') + '%');
  const { data, error } = await query; if (error) return err(error);
  $('view').innerHTML = `
    <div class="bar"><h2>Patients</h2><div style="display:flex;gap:8px"><input id="ps" placeholder="Search by name" value="${esc(q)}"><button id="pAdd">Add patient</button></div></div>
    <form id="pf" class="form hide">
      <div><label>Full name</label><input name="full_name" required></div>
      <div><label>Date of birth</label><input name="dob" type="date"></div>
      <div><label>Gender</label><select name="gender"><option value="">Not stated</option><option>Female</option><option>Male</option><option>Other</option></select></div>
      <div><label>Phone</label><input name="phone"></div>
      <div class="full"><label>Address</label><input name="address"></div>
      <div class="full"><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
      <div class="full"><button>Save patient</button></div>
    </form>
    ${data.length ? `<div class="wrap"><table><tr><th>Name</th><th>Born</th><th>Gender</th><th>Phone</th><th></th></tr>
    ${data.map(p => `<tr><td><a href="patient.html?id=${p.id}"><b>${esc(p.full_name)}</b></a><br><span style="color:var(--mute)">${esc(p.notes)}</span></td><td>${esc(p.dob)}</td><td>${esc(p.gender)}</td><td>${esc(p.phone)}</td>
    <td>${me.role === 'admin' ? `<button class="danger" data-del="${p.id}">Delete</button>` : ''}</td></tr>`).join('')}</table></div>`
    : `<div class="empty">${q ? 'No patients match that name.' : 'No patients yet. Add the first one.'}</div>`}`;
  $('pAdd').onclick = () => $('pf').classList.toggle('hide');
  $('ps').onchange = e => patientsView(e.target.value.trim());
  $('pf').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)); f.created_by = me.id;
    Object.keys(f).forEach(k => f[k] === '' && (f[k] = null));
    const { error } = await sb.from('patients').insert(f); if (error) return err(error); patientsView();
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this patient and their appointments?')) return;
    const { error } = await sb.from('patients').delete().eq('id', b.dataset.del); if (error) return err(error); patientsView();
  });
}
</script>
</body>
</html>
