<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacy · Aurelia Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let me;
(async () => { me = await guard('pharmacy', { roles:['admin','doctor','nurse'] }); if (me) view(); })();
async function view(){
  const { data, error } = await sb.from('medicines').select('*').order('name'); if (error) return err(error);
  const edit = ['admin','nurse'].includes(me.role), low = data.filter(m => m.stock <= m.reorder_level).length;
  $('view').innerHTML = `<div class="bar"><h2>Pharmacy</h2>${edit ? '<button id="add">Add medicine</button>' : ''}</div>
    ${low ? `<p class="low">${low} medicine${low > 1 ? 's are' : ' is'} at or below the reorder level.</p>` : ''}
    ${edit ? `<form id="f" class="form hide"><div><label>Name</label><input name="name" required></div><div><label>Unit</label><input name="unit" value="tablets"></div>
      <div><label>Opening stock</label><input name="stock" type="number" min="0" value="0"></div><div><label>Reorder level</label><input name="reorder_level" type="number" min="0" value="10"></div>
      <div><label>Unit price (GH₵)</label><input name="unit_price" type="number" min="0" step="0.01" value="0"></div><div class="full"><button>Save medicine</button></div></form>` : ''}
    ${data.length ? `<div class="wrap"><table><tr><th>Medicine</th><th>In stock</th><th>Reorder at</th><th>Unit price</th>${edit ? '<th>Adjust stock</th>' : ''}</tr>
    ${data.map(m => `<tr><td><b>${esc(m.name)}</b></td><td class="${m.stock <= m.reorder_level ? 'low' : ''}">${m.stock} ${esc(m.unit)}</td><td>${m.reorder_level}</td><td>${money(m.unit_price)}</td>
    ${edit ? `<td><input type="number" min="1" value="1" data-q="${m.id}" style="width:72px"> <button data-add="${m.id}">Add</button> <button class="ghost" data-use="${m.id}">Dispense</button>${me.role === 'admin' ? ` <button class="danger" data-del="${m.id}">Delete</button>` : ''}</td>` : ''}</tr>`).join('')}</table></div>` : '<div class="empty">No medicines yet.</div>'}`;
  if (!edit) return;
  $('add').onclick = () => $('f').classList.toggle('hide');
  $('f').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    ['stock','reorder_level','unit_price'].forEach(k => f[k] = Number(f[k]));
    const { error } = await sb.from('medicines').insert(f); if (error) return err(error); view(); };
  const adjust = sign => async ev => { const id = ev.target.dataset.add || ev.target.dataset.use, m = data.find(x => x.id === id);
    const q = Number(document.querySelector(`[data-q="${id}"]`).value) || 0, ns = m.stock + sign * q;
    if (ns < 0) return alert('Not enough stock to dispense that many.');
    const { error } = await sb.from('medicines').update({ stock: ns }).eq('id', id); if (error) return err(error); view(); };
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = adjust(1));
  document.querySelectorAll('[data-use]').forEach(b => b.onclick = adjust(-1));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Delete this medicine?')) return;
    const { error } = await sb.from('medicines').delete().eq('id', b.dataset.del); if (error) return err(error); view(); });
}
</script>
</body>
</html>
