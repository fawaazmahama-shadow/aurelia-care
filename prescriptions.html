<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prescriptions · Aurelia Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let me;
(async () => { me = await guard('prescriptions', { roles:['admin','doctor','nurse'] }); if (me) view(); })();
async function view(){
  const [r, p, m] = await Promise.all([
    sb.from('prescriptions').select('*, patients(full_name), medicines(name, unit, stock), prescriber:profiles!prescriptions_prescribed_by_fkey(full_name)').order('created_at', { ascending:false }).limit(300),
    sb.from('patients').select('id, full_name').order('full_name'), sb.from('medicines').select('id, name, stock').order('name')
  ]);
  if (r.error) return err(r.error);
  const prescribe = ['admin','doctor'].includes(me.role), disp = ['admin','nurse'].includes(me.role);
  $('view').innerHTML = `<div class="bar"><h2>Prescriptions</h2>${prescribe ? '<button id="add">New prescription</button>' : ''}</div>
    ${prescribe ? `<form id="f" class="form hide"><div><label>Patient</label><select name="patient_id" required><option value="">Choose patient</option>${(p.data || []).map(x => `<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></div>
      <div><label>Medicine</label><select name="medicine_id" required><option value="">Choose medicine</option>${(m.data || []).map(x => `<option value="${x.id}">${esc(x.name)} (${x.stock} in stock)</option>`).join('')}</select></div>
      <div><label>Dosage</label><input name="dosage" required placeholder="1 tablet twice daily for 5 days"></div><div><label>Quantity to dispense</label><input name="quantity" type="number" min="1" value="1" required></div>
      <div class="full"><button>Save prescription</button></div></form>` : ''}
    ${r.data.length ? `<div class="wrap"><table><tr><th>Date</th><th>Patient</th><th>Medicine</th><th>Dosage</th><th>Qty</th><th>By</th><th>Status</th><th></th></tr>
    ${r.data.map(x => `<tr><td>${esc(new Date(x.created_at).toLocaleDateString())}</td><td><a href="patient.html?id=${x.patient_id}">${esc(x.patients?.full_name)}</a></td><td>${esc(x.medicines?.name)}</td><td>${esc(x.dosage)}</td><td>${x.quantity}</td><td>${esc(x.prescriber?.full_name || '')}</td><td><span class="pill">${esc(x.status)}</span></td>
    <td>${x.status === 'pending' ? `${disp ? `<button data-d="${x.id}">Dispense</button> ` : ''}${prescribe ? `<button class="danger" data-c="${x.id}">Cancel</button>` : ''}` : ''}</td></tr>`).join('')}</table></div>` : '<div class="empty">No prescriptions yet.</div>'}`;
  if (prescribe){ $('add').onclick = () => $('f').classList.toggle('hide');
    $('f').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.quantity = Number(f.quantity); f.prescribed_by = me.id;
      const { error } = await sb.from('prescriptions').insert(f); if (error) return err(error); view(); }; }
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { const { error } = await sb.rpc('dispense_prescription', { p_id: b.dataset.d }); if (error) return err(error); view(); });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = async () => { if (!confirm('Cancel this prescription?')) return;
    const { error } = await sb.from('prescriptions').update({ status:'cancelled' }).eq('id', b.dataset.c).eq('status','pending'); if (error) return err(error); view(); });
}
</script>
</body>
</html>
