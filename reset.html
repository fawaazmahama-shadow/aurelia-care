<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password · Aurelia Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="center"><div class="box">
  <h1>Aurelia Care</h1><p>Choose a new password.</p>
  <label for="pw">New password</label><input id="pw" type="password" minlength="6" autocomplete="new-password"><button class="full" id="go">Update password</button>
  <a href="login.html" style="display:block;margin-top:12px;font-size:.9rem">Back to sign in</a>
  <div class="msg" id="msg" role="alert"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
if (!configured) needSetup(); else {
$('go').onclick = async () => {
  const msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
  if ($('pw').value.length < 6){ msg.textContent = 'Use at least 6 characters.'; return; }
  const { error } = await sb.auth.updateUser({ password: $('pw').value });
  if (error) msg.textContent = error.message; else { msg.className = 'msg ok'; msg.textContent = 'Password updated. Redirecting to sign in…'; setTimeout(() => location.replace('login.html'), 1500); }
};
}
</script>
</body>
</html>
